<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo CO₂-Footprint">
  <!-- Eigenes, einfaches Logo: Erdkugel mit Blatt und Fußabdruck-Punkten -->
  <circle cx="32" cy="32" r="30" fill="#166534"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#bbf7d0" stroke-width="2"/>
  <!-- Blatt -->
  <path d="M18 44c0-12 9-20 26-20 0 14-8 24-20 24-2 0-4-1-6-4z" fill="#bbf7d0"/>
  <path d="M20 46c6-8 12-13 20-17" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
  <!-- Fußabdruck-Punkte (stehen für den "Footprint") -->
  <circle cx="20" cy="22" r="2.4" fill="#bbf7d0"/>
  <circle cx="28" cy="18" r="2.4" fill="#bbf7d0"/>
  <circle cx="36" cy="16" r="2.4" fill="#bbf7d0"/>
  <circle cx="44" cy="17" r="2.4" fill="#bbf7d0"/>
</svg>
